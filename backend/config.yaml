# ========================================
# 苹果果学习助手 - 主配置文件
# ========================================
# 此文件中的配置可通过环境变量覆盖
# 环境变量格式: APP_VARIABLE_NAME

# ── 应用配置 ──
app_name: "苹果果学习助手"
app_version: "0.1.0"
debug: false

# ── 服务配置 ──
host: "0.0.0.0"
port: 8000

# ── CORS 配置 ──
cors_origins:
  - "http://localhost:3000"
  - "http://127.0.0.1:3000"
  # 生产环境请添加实际域名:
  # - "https://yourdomain.com"

# ── LLM 模型配置 ──
# 使用 OpenAI 兼容格式指定模型（通过 .env 环境变量配置）
# 支持: openai/xxx 或任何 OpenAI 兼容端点
# 模型名从环境变量读取: TEXT_MODEL / TEXT_REASONING_MODEL / TEXT_FAST_MODEL
# API 端点从环境变量: OPENAI_API_BASE / OPENAI_API_KEY

# 默认文本模型（一般对话/讲解）— 见 .env 中的 TEXT_MODEL
text_model: null

# 推理模型（复杂题/错题分析/学习规划）— 见 .env 中的 TEXT_REASONING_MODEL
text_reasoning_model: null

# 轻量模型（意图识别/情绪分析）— 见 .env 中的 TEXT_FAST_MODEL
text_fast_model: null

# OpenAI 兼容 API 端点 — 见 .env 中的 OPENAI_API_BASE
openai_api_base: null

# ── BKT 知识追踪参数 ──
bkt_default_p_know: 0.0      # 初始掌握概率
bkt_default_p_learn: 0.3     # 初始学习概率
bkt_default_p_guess: 0.25    # 猜对概率
bkt_default_p_slip: 0.1      # 失手概率
bkt_mastery_threshold: 0.8   # 掌握判定阈值

# ── 会话管理 ──
max_history_messages: 20       # 保留的最大历史消息数
session_timeout_minutes: 60    # 会话超时时间（分钟）

# ── 存储配置 ──
content_store_type: "memory"   # MVP使用内存存储
# content_store_type: "db"     # 后续可切换为数据库

# ── LiteLLM 模型列表（可选，用于自定义模型路由） ──
# 如需配置，请通过 .env 环境变量设置，不要在 YAML 中硬编码模型名。
# litellm_model_list: []
