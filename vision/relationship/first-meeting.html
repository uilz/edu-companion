<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>第一次见面 · 我们共同走过的路 · AppleGo</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body { background: #0f0f12; color: #e5e5ea; }
  #bottom-nav { background: rgba(15,15,18,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top-color: rgba(255,255,255,0.06); }
  .nav-tab { color: rgba(255,255,255,0.35); }
  .nav-tab:hover { color: rgba(255,255,255,0.65); }
  .nav-tab.active { color: #0a84ff; }
  ::selection { background: rgba(10,132,255,0.25); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-3) 0; margin-bottom: var(--space-5);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .top-bar .tb-brand { font-size: 15px; font-weight: 700; }
  .top-bar .tb-tab { font-size: 13px; color: rgba(255,255,255,0.35); font-weight: 500; padding: 4px 12px; }
  .top-bar .tb-tab.active { color: #0a84ff; }

  .meeting-hero {
    text-align: center; padding: var(--space-8) var(--space-4);
    position: relative;
  }
  .meeting-hero::after {
    content: ''; position: absolute; bottom: 0; left: 30%; right: 30%;
    height: 1px; background: rgba(255,255,255,0.06);
  }
  .meeting-hero .mh-icon { font-size: 56px; display: block; margin-bottom: var(--space-4); }
  .meeting-hero h1 {
    font-size: 28px; font-weight: 700; letter-spacing: -0.02em;
    color: #fff; margin-bottom: var(--space-3);
  }
  .meeting-hero .mh-sub {
    font-size: 15px; line-height: 1.7;
    color: rgba(255,255,255,0.45); max-width: 340px; margin: 0 auto;
    margin-bottom: var(--space-6);
  }

  .explanation {
    margin: var(--space-6) 0;
    padding: var(--space-5); border-radius: var(--radius-lg);
    background: rgba(255,255,255,0.04);
  }
  .explanation .ex-label {
    font-size: 12px; font-weight: 600; color: rgba(10,132,255,0.6);
    margin-bottom: var(--space-3); letter-spacing: 0.04em;
  }
  .explanation .ex-text {
    font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.6);
  }

  .future-section { margin-bottom: var(--space-6); }
  .future-section .fs-label {
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.2);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-4);
  }
  .future-section .fs-hint {
    font-size: 13px; color: rgba(255,255,255,0.25);
    margin-bottom: var(--space-4); font-style: italic;
  }

  .placeholder-timeline { display: flex; flex-direction: column; gap: var(--space-3); }
  .placeholder-item {
    display: flex; align-items: flex-start; gap: 14px;
    padding: var(--space-4); border-radius: var(--radius-md);
    background: rgba(255,255,255,0.04);
    position: relative;
  }
  .placeholder-item .pi-dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.08);
    flex-shrink: 0; margin-top: 4px;
    position: relative;
  }
  .placeholder-item .pi-dot::after {
    content: ''; position: absolute; top: 12px; left: 3px;
    width: 2px; height: 40px; background: rgba(255,255,255,0.04);
  }
  .placeholder-item:last-child .pi-dot::after { display: none; }
  .placeholder-item .pi-body { flex: 1; }
  .placeholder-item .pi-text {
    font-size: 13.5px; line-height: 1.6;
    color: rgba(255,255,255,0.25);
  }
  .placeholder-item .pi-icon { font-size: 14px; opacity: 0.3; }

  .cta-section {
    text-align: center; padding: var(--space-6);
  }
  .cta-section .cta-btn {
    display: inline-block; padding: 14px 36px;
    border-radius: var(--radius-full);
    background: #0a84ff; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(10,132,255,0.2);
  }
  .cta-section .cta-btn:hover {
    background: #0070e0; transform: translateY(-1px);
  }
  .cta-section .cta-hint {
    margin-top: 10px; font-size: 12px; color: rgba(255,255,255,0.2);
  }
</style>
</head>
<body>

<div id="app">

  <div class="top-bar">
    <span class="tb-brand">🍎 AppleGo</span>
    <span class="tb-tab">Relationship</span>
  </div>

  <div class="meeting-hero">
    <span class="mh-icon">🍎</span>
    <h1>第一次见面</h1>
    <div class="mh-sub">
      很高兴认识你。<br>
      从这里开始，我们一起学习。
    </div>
  </div>

  <div class="explanation">
    <div class="ex-label">🤝 这里会记录什么</div>
    <div class="ex-text">
      以后这里会记录我们一起走过的路——你的每一次理解突破、每一个学习方式的变化、每一个值得记住的瞬间。<br><br>
      没有分数，没有排行榜。只有你和苹果果共同经历的故事。
    </div>
  </div>

  <div class="future-section">
    <div class="fs-label">未来的重要时刻</div>
    <div class="fs-hint">AI 希望在未来见证的——</div>

    <div class="placeholder-timeline">
      <div class="placeholder-item">
        <div class="pi-dot"></div>
        <div class="pi-body">
          <div class="pi-text">当你第一次用自己的话解释一个概念……</div>
        </div>
      </div>
      <div class="placeholder-item">
        <div class="pi-dot"></div>
        <div class="pi-body">
          <div class="pi-text">当你第一次发现自己在进步……</div>
        </div>
      </div>
      <div class="placeholder-item">
        <div class="pi-dot"></div>
        <div class="pi-body">
          <div class="pi-text">当你第一次说"这个和那个有点像"——知识开始连接……</div>
        </div>
      </div>
      <div class="placeholder-item">
        <div class="pi-dot"></div>
        <div class="pi-body">
          <div class="pi-text">当你遇到困难但没有放弃……</div>
        </div>
      </div>
      <div class="placeholder-item">
        <div class="pi-dot"></div>
        <div class="pi-body">
          <div class="pi-text">当我们一起走过一个月……</div>
        </div>
      </div>
    </div>
  </div>

  <div class="cta-section">
    <div class="cta-btn">开始第一次学习</div>
    <div class="cta-hint">未来从这里开始</div>
  </div>

</div>

<!-- Bottom Navigation -->
<nav id="bottom-nav">
  <button class="nav-tab" data-page="workspace">
    <svg viewBox="0 0 24 24" fill="none"><path d="M3 3h7v7H3V3zM14 3h7v7h-7V3zM3 14h7v7H3v-7zM14 14h7v7h-7v-7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span>Workspace</span>
  </button>
  <button class="nav-tab" data-page="memory">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Memory</span>
  </button>
  <button class="nav-tab" data-page="brain">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 4a4 4 0 014 4c0 1.5-.8 2.8-2 3.5V14a2 2 0 01-2 2 2 2 0 01-2-2v-2.5c-1.2-.7-2-2-2-3.5a4 4 0 014-4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 19h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Brain</span>
  </button>
  <button class="nav-tab" data-page="universe">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Universe</span>
  </button>
  <button class="nav-tab active" data-page="relationship">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-8-5-8-10a8 8 0 1116 0c0 5-8 10-8 10z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="11" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>Rel.</span>
  </button>
</nav>

</body>
</html>
