<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>你回来了 · 我们共同走过的路 · AppleGo</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  body { background: #0f0f12; color: #e5e5ea; }
  #bottom-nav { background: rgba(15,15,18,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top-color: rgba(255,255,255,0.06); }
  .nav-tab { color: rgba(255,255,255,0.35); }
  .nav-tab:hover { color: rgba(255,255,255,0.65); }
  .nav-tab.active { color: #0a84ff; }
  ::selection { background: rgba(10,132,255,0.25); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }

  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--space-3) 0; margin-bottom: var(--space-5);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .top-bar .tb-brand { font-size: 15px; font-weight: 700; }
  .top-bar .tb-tab { font-size: 13px; color: rgba(255,255,255,0.35); font-weight: 500; padding: 4px 12px; }
  .top-bar .tb-tab.active { color: #0a84ff; }

  .welcome-section {
    text-align: center; padding: var(--space-6) 0;
  }
  .welcome-section .ws-icon { font-size: 48px; display: block; margin-bottom: var(--space-4); }
  .welcome-section h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
    color: #fff; margin-bottom: var(--space-3);
  }
  .welcome-section .ws-message {
    font-size: 15px; line-height: 1.8;
    color: rgba(255,255,255,0.5); max-width: 360px; margin: 0 auto;
  }

  .gap-visual {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; margin: var(--space-6) 0; padding: 0 var(--space-4);
  }
  .gap-visual .gv-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: rgba(255,255,255,0.08); flex-shrink: 0;
  }
  .gap-visual .gv-dot.filled { background: #0a84ff; }
  .gap-visual .gv-dot.gap {
    width: 24px; height: 8px; border-radius: 4px;
    background: rgba(255,255,255,0.05);
    position: relative; overflow: hidden;
  }
  .gap-visual .gv-dot.gap::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px, transparent 3px,
      rgba(255,255,255,0.03) 3px, rgba(255,255,255,0.03) 6px
    );
  }
  .gap-visual .gv-label {
    font-size: 10px; color: rgba(255,255,255,0.15);
    position: absolute; margin-top: 14px;
  }

  .last-moment {
    margin-bottom: var(--space-5);
  }
  .last-moment .lm-label {
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.2);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-3);
  }
  .last-moment .lm-card {
    background: rgba(255,255,255,0.04); border-radius: var(--radius-md);
    padding: var(--space-4); border-left: 3px solid rgba(255,159,10,0.3);
  }
  .last-moment .lm-card .lm-date { font-size: 11px; color: rgba(255,255,255,0.3); margin-bottom: 4px; }
  .last-moment .lm-card .lm-text { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.6; }

  .status-card {
    padding: var(--space-5); border-radius: var(--radius-lg);
    background: rgba(10,132,255,0.04); border: 1px solid rgba(10,132,255,0.1);
    margin-bottom: var(--space-5);
  }
  .status-card .sc-label {
    font-size: 12px; font-weight: 600; color: #5ac8fa; margin-bottom: var(--space-3);
  }
  .status-card .sc-text {
    font-size: 14px; line-height: 1.7; color: rgba(255,255,255,0.65);
  }
  .status-card .sc-cta {
    display: inline-block; margin-top: var(--space-4);
    padding: 12px 28px; border-radius: var(--radius-full);
    background: #0a84ff; color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all 0.2s;
  }
  .status-card .sc-cta:hover { background: #0070e0; transform: translateY(-1px); }
  .status-card .sc-hint {
    margin-top: 10px; font-size: 12px; color: rgba(255,255,255,0.3);
  }

  .rel-footer {
    text-align: center; padding: var(--space-6) var(--space-4);
    color: rgba(255,255,255,0.2); font-size: 13px; line-height: 1.8;
  }
</style>
</head>
<body>

<div id="app">

  <div class="top-bar">
    <span class="tb-brand">🍎 AppleGo</span>
    <span class="tb-tab">Relationship</span>
  </div>

  <div class="welcome-section">
    <span class="ws-icon">👋</span>
    <h1>你回来了</h1>
    <div class="ws-message">
      这段时间我没有忘记你——<br>
      你的学习记录都在这里。
    </div>
  </div>

  <div class="gap-visual">
    <div class="gv-dot filled"></div>
    <div class="gv-dot filled"></div>
    <div class="gv-dot filled"></div>
    <div class="gv-dot filled"></div>
    <div class="gv-dot gap"></div>
    <div class="gv-dot" style="opacity:0.3;"></div>
    <div class="gv-dot" style="opacity:0.3;"></div>
    <div class="gv-dot" style="opacity:0.3;"></div>
    <span style="font-size:10px;color:rgba(255,255,255,0.12);position:relative;top:-4px;">— 你离开的这段时间 —</span>
  </div>

  <div class="last-moment">
    <div class="lm-label">离开前的最后一段记忆</div>
    <div class="lm-card">
      <div class="lm-date">7 月 10 日</div>
      <div class="lm-text">你在纸上推导了矩阵是否可逆的完整条件，写了满满一页。你说"终于搞懂了"。</div>
    </div>
  </div>

  <div class="status-card">
    <div class="sc-label">📌 上次学到哪里了</div>
    <div class="sc-text">
      你之前在学习<strong>线性代数</strong>——矩阵的逆、行列式、线性变换。你已经掌握了矩阵乘法的几何意义，正在深入理解逆矩阵的几何解释。<br><br>
      如果你想继续，我已经准备好了。你也可以从上次中断的地方重新开始。
    </div>
    <div class="sc-cta">继续上次的学习</div>
    <div class="sc-hint">或者重新开始，都很好</div>
  </div>

  <div class="rel-footer">
    没有责备，没有压力。<br>
    你回来，就是最好的事。
  </div>

</div>

<!-- Bottom Navigation -->
<nav id="bottom-nav">
  <button class="nav-tab" data-page="workspace">
    <svg viewBox="0 0 24 24" fill="none"><path d="M3 3h7v7H3V3zM14 3h7v7h-7V3zM3 14h7v7H3v-7zM14 14h7v7h-7v-7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span>Workspace</span>
  </button>
  <button class="nav-tab" data-page="memory">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Memory</span>
  </button>
  <button class="nav-tab" data-page="brain">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 4a4 4 0 014 4c0 1.5-.8 2.8-2 3.5V14a2 2 0 01-2 2 2 2 0 01-2-2v-2.5c-1.2-.7-2-2-2-3.5a4 4 0 014-4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 19h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Brain</span>
  </button>
  <button class="nav-tab" data-page="universe">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Universe</span>
  </button>
  <button class="nav-tab active" data-page="relationship">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-8-5-8-10a8 8 0 1116 0c0 5-8 10-8 10z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="11" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>Rel.</span>
  </button>
</nav>

</body>
</html>
