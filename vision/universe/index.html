<!DOCTYPE html>
<html lang="zh-CN" class="theme-beige">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🌌 你的知识宇宙 · AppleGo</title>
<link rel="stylesheet" href="../design-system.css">
<style>
/* ── Beige Theme ── */
body { background: var(--page-bg); color: var(--text-primary); }
#app { max-width: var(--content-max); margin: 0 auto; padding: 0 var(--space-4) var(--space-6); }

/* ── Top Bar ── */
.top-bar {
  display: flex; align-items: center; gap: var(--space-3);
  padding: 16px var(--space-4); padding-top: calc(16px + env(safe-area-inset-top, 0));
  background: var(--nav-bg); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-light);
  position: sticky; top: 0; z-index: 50;
}
.top-bar .tb-brand { font-size: 16px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
.top-bar .tb-brand span { color: var(--text-muted); font-weight: 400; }

/* ── Tab Bar ── */
.tab-bar {
  display: flex; gap: 0; overflow-x: auto;
  border-bottom: 1px solid var(--border-light);
  background: var(--surface-bg);
  scrollbar-width: none; position: sticky; top: 57px; z-index: 49;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-item {
  flex-shrink: 0; padding: 12px 16px;
  font-size: 13px; font-weight: 500; color: var(--text-muted);
  border-bottom: 2px solid transparent;
  transition: all 0.15s var(--ease-out); white-space: nowrap;
  text-decoration: none; cursor: pointer;
}
.tab-item:hover { color: var(--text-secondary); }
.tab-item.active { color: #5ac8fa; border-bottom-color: #5ac8fa; }

/* ── Page Hero ── */
.page-hero { padding: var(--space-6) 0 var(--space-5); }
.page-hero h1 { font-size: 28px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; margin-bottom: 6px; }
.page-hero p { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }

/* ── Constellation Visualization ── */
.constellation-container {
  position: relative; background: rgba(255,255,255,0.02);
  border-radius: var(--radius-xl); padding: var(--space-6) var(--space-5);
  border: 1px solid rgba(255,255,255,0.06);
  min-height: 400px; margin-bottom: var(--space-5);
  overflow: hidden;
}
.constellation-svg {
  width: 100%; height: 360px;
}

/* ── Node Styles ── */
.cn-node { cursor: pointer; transition: all 0.2s; }
.cn-node:hover .node-circle { filter: brightness(1.4); }
.cn-node:hover .node-label { opacity: 1; }
.node-circle { transition: all 0.2s; }
.node-glow { opacity: 0.3; transition: all 0.3s; }
.cn-node:hover .node-glow { opacity: 0.6; }
.node-label { font-size: 11px; fill: rgba(255,255,255,0.6); transition: all 0.2s; }
.node-hover-label { font-size: 10px; fill: rgba(255,255,255,0.35); }

/* ── Connection Lines ── */
.cn-line { stroke: var(--border-light); stroke-width: 1.5; transition: all 0.2s; }
.cn-node:hover ~ .cn-line, .cn-line:hover { stroke: rgba(90,200,250,0.3); }

/* ── Tooltip ── */
.tooltip {
  position: absolute; background: rgba(45,42,36,0.95);
  border: 1px solid var(--border-light); border-radius: var(--radius-md);
  padding: 12px 16px; backdrop-filter: blur(10px);
  pointer-events: none; z-index: 10;
  display: none; min-width: 140px;
}
.tooltip.visible { display: block; }
.tooltip .tt-name { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
.tooltip .tt-count { font-size: 11px; color: var(--text-muted); }

/* ── Side Panel ── */
.side-panel { display: flex; flex-direction: column; gap: var(--space-3); }
.panel-card {
  background: var(--surface-alt); border-radius: var(--radius-lg);
  padding: var(--space-4); border: 1px solid var(--border-light);
}
.panel-card .pc-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.panel-card .pc-body { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
.panel-card .pc-body strong { color: var(--text-primary); }
.panel-card .pc-link {
  font-size: 12px; font-weight: 600; color: #5ac8fa; margin-top: 8px; display: inline-block; cursor: pointer;
  text-decoration: none;
}
.panel-card .pc-link:hover { color: #7ad4ff; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <div class="tb-brand">🍎 AppleGo <span>| Universe</span></div>
</div>

<!-- Tab Bar -->
<nav class="tab-bar">
  <a class="tab-item active" href="index.html">宇宙视图</a>
  <a class="tab-item" href="mission-view.html">Missions</a>
  <a class="tab-item" href="discovery.html">发现</a>

<main id="app">

      <!-- TCP (small cluster, bottom-right) -->
      <g class="cn-node" onmouseenter="showTooltip(event, 'TCP 协议', 3)" onmouseleave="hideTooltip()">

        <text class="node-label" x="420" y="263" text-anchor="middle">TCP</text>
      </g>

      <!-- 三次握手 (tiny, far right) -->
      <g class="cn-node" onmouseenter="showTooltip(event, '三次握手', 2)" onmouseleave="hideTooltip()">
        <circle class="node-glow" cx="470" cy="310" r="12" fill="rgba(255,255,255,0.2)"/>
        <circle class="node-circle" cx="470" cy="310" r="9" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
        <text class="node-label" x="470" y="326" text-anchor="middle">三次握手</text>
      </g>

      <!-- 计算机图形 (tiny, far left) -->
      <g class="cn-node" onmouseenter="showTooltip(event, '计算机图形', 2)" onmouseleave="hideTooltip()">
        <circle class="node-glow" cx="30" cy="310" r="12" fill="rgba(255,255,255,0.2)"/>
        <circle class="node-circle" cx="30" cy="310" r="9" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    </svg>

    <!-- Tooltip -->
    <div class="tooltip" id="tooltip">
      <div class="tt-name" id="tt-name"></div>
      <div class="tt-count" id="tt-count"></div>
    </div>
  </div>

  <!-- Side Panel -->
  <div class="side-panel">
    <div class="panel-card">
      <div class="pc-title">🎯 活跃任务</div>
      <div class="pc-body">
        <strong>理解线性代数的几何意义</strong> — 已覆盖矩阵乘法、线性变换。接下来：特征向量、基变换。

    </div>

</main>

<script>
function showTooltip(event, name, count) {
  const tip = document.getElementById('tooltip');
  document.getElementById('tt-name').textContent = name;
  document.getElementById('tt-count').textContent = `学习活动 ${count} 次`;
  const rect = document.getElementById('constellation').getBoundingClientRect();
  const svgRect = event.target.closest('svg').getBoundingClientRect();
  tip.style.left = (event.clientX - rect.left + 12) + 'px';
  tip.style.top = (event.clientY - rect.top - 10) + 'px';
  tip.classList.add('visible');
}
function hideTooltip() {
  document.getElementById('tooltip').classList.remove('visible');
}
</script>

</body>
</html>
