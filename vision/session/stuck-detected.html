<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🍎 苹果果 · 卡住检测</title>
<link rel="stylesheet" href="../design-system.css">
<style>
/* ── Session Overlay ── */
#session-overlay {
  position: fixed; inset: 0; background: var(--color-page); z-index: 200;
  display: flex; flex-direction: column;
  animation: sessionEnter .3s var(--ease-out);
}
@keyframes sessionEnter {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.session-topbar {
  background: rgba(255,255,255,.88); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--color-divider);
  padding: 14px var(--space-4); display: flex; align-items: center; gap: var(--space-3);
  padding-top: calc(14px + env(safe-area-inset-top, 0));
}
.session-back {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  color: var(--color-ink-secondary); flex-shrink: 0; transition: background .15s;
}
.session-back:hover { background: var(--color-surface-hover); }
.session-title {
  flex: 1; font-size: 15px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-tools-trigger {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  color: var(--color-ink-secondary); transition: all .15s; position: relative;
}
.session-tools-trigger:hover { background: var(--color-surface-hover); color: var(--color-ink-primary); }
.session-tools-trigger .nudge {
  position: absolute; top: -2px; right: -2px;
  background: var(--color-accent); color: #fff; font-size: 9px; font-weight: 700;
  width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.session-stages { display: flex; gap: 4px; align-items: center; }
.stage-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--color-divider);
  transition: all .3s var(--ease-out);
}
.stage-dot.active { background: var(--color-accent); width: 18px; border-radius: 3px; }
.stage-dot.done { background: var(--color-accent); }
.session-progress { height: 3px; background: var(--color-divider-soft); position: relative; }
.session-progress-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: var(--color-accent); border-radius: 0 3px 3px 0;
  transition: width .5s var(--ease-out);
}
.session-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

/* ── Conversation ── */
.conversation {
  flex: 1; display: flex; flex-direction: column;
  max-width: var(--content-max); margin: 0 auto; width: 100%;
  padding: var(--space-5) var(--space-5) var(--space-3);
}
.msg-list { flex: 1; display: flex; flex-direction: column; gap: var(--space-4); padding-bottom: var(--space-4); }
.msg { display: flex; gap: 10px; align-items: flex-end; animation: msgIn .3s var(--ease-out); }
@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-avatar {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center; font-size: 13px; font-weight: 600;
}
.msg.ai .msg-avatar { background: linear-gradient(135deg, #c4a3d4 0%, #7a5a8c 100%); color: #fff; }
.msg.user { flex-direction: row-reverse; }
.msg.user .msg-avatar { border-radius: 8px; background: var(--color-accent); color: #fff; }
.msg-bubble {
  max-width: 80%; padding: 13px 16px; font-size: 15px; line-height: 1.65;
}
.msg.ai .msg-bubble { background: var(--color-ai-msg); border-radius: 3px 18px 18px 18px; }
.msg.user .msg-bubble { background: var(--color-user-msg); border-radius: 18px 18px 3px 18px; }
.typing-cursor {
  display: inline-block; width: 2px; height: 1em;
  background: var(--color-ink-secondary); margin-left: 2px;
  vertical-align: text-bottom; animation: blink .8s infinite;
}
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
.learn-input-bar {
  display: flex; gap: 8px; padding: var(--space-3) var(--space-5);
  background: rgba(255,255,255,.88); backdrop-filter: blur(20px);
  border-top: 1px solid var(--color-divider);
  max-width: var(--content-max); margin: 0 auto; width: 100%;
}
.learn-input-bar input {
  flex: 1; background: var(--color-surface);
  border: 1.5px solid var(--color-divider); border-radius: var(--radius-full);
  padding: 12px 18px; font-size: 14px; outline: none; transition: border-color .15s;
}
.learn-input-bar input:focus { border-color: var(--color-accent); }
.learn-send {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--color-accent); color: #fff; display: grid; place-items: center;
  flex-shrink: 0; transition: all .15s;
}
.learn-send:hover { background: var(--color-accent-hover); }
.suggestion-row {
  display: flex; gap: 8px; padding: 0 var(--space-5) var(--space-3);
  flex-wrap: wrap; max-width: var(--content-max); margin: 0 auto; width: 100%;
}
.suggestion-pill {
  background: var(--color-surface); border: 1px solid var(--color-divider);
  border-radius: var(--radius-full); padding: 8px 14px; font-size: 13px;
  color: var(--color-ink-secondary); transition: all .15s;
}
.suggestion-pill:hover { border-color: var(--color-ink-muted); color: var(--color-ink-primary); }

/* ── Stuck Detection ── */
.stuck-banner {
  margin: var(--space-3) var(--space-5) 0;
  background: linear-gradient(135deg, var(--color-warning-soft), transparent);
  border-left: 3px solid var(--color-warning);
  border-radius: var(--radius-md); padding: 14px 16px;
  display: flex; gap: 10px; align-items: flex-start;
  animation: msgIn .4s var(--ease-spring);
}
@keyframes ease-spring { from { } to { } }
.stuck-banner .sb-icon { font-size: 20px; flex-shrink: 0; }
.stuck-banner .sb-text { font-size: 14px; line-height: 1.6; color: var(--color-ink-primary); }
.stuck-banner .sb-text strong { color: var(--color-warning); }
.fade-in { animation: fadeIn .4s var(--ease-out); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<main id="app" style="display:none">
  <p>Session overlay below</p>
</main>

<!-- Session Overlay -->
<div id="session-overlay">
  <div class="session-topbar">
    <button class="session-back">
      <svg viewBox="0 0 24 24" fill="none" width="22" height="22">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="session-title">理解矩阵乘法</div>
    <button class="session-tools-trigger" title="学习工具">
      <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
        <path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 005.4-5.4l-2.5 2.5-2-2 2.5-2.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span class="nudge">!</span>
    </button>
    <div class="session-stages">
      <div class="stage-dot done"></div>
      <div class="stage-dot active"></div>
      <div class="stage-dot"></div>
      <div class="stage-dot"></div>
    </div>
  </div>
  <div class="session-progress"><div class="session-progress-fill" style="width:25%"></div></div>
  <div class="session-body">

    <!-- State Meta -->
    <div class="state-meta" style="margin:var(--space-4) var(--space-4) 0">
      <div class="sm-row">
        <span class="sm-label">Emotion Goal</span>
        <span class="sm-value"><span class="sm-emotion cautious">🟡 cautious</span> 被帮助 + 不尴尬 — "AI 发现我不懂了"</span>
      </div>
      <div class="sm-row">
        <span class="sm-label">AI Behavior</span>
        <span class="sm-value">Stage: learn（chat mode）· 检测到困惑 · 主动提供新角度</span>
      </div>
      <div class="sm-row">
        <span class="sm-label">Time Dimension</span>
        <span class="sm-value">第 2 次学习 · Learn 阶段中途</span>
      </div>
    </div>

    <!-- Stuck Banner -->
    <div class="stuck-banner">
      <div class="sb-icon">🧐</div>
      <div class="sb-text"><strong>苹果果检测到卡顿</strong></div>
    </div>

    <!-- Conversation -->
    <div class="conversation">
      <div class="msg-list">
        <div class="msg ai">
          <div class="msg-avatar">🍎</div>
          <div class="msg-bubble">昨天我们停在矩阵乘法的定义。今天我想和你一起把它用起来。</div>
        </div>
        <div class="msg ai">
          <div class="msg-avatar">🍎</div>
          <div class="msg-bubble">矩阵乘法不是把对应位置的数字相乘。它是「用一个矩阵的行，去乘另一个矩阵的列」。</div>
        </div>
        <div class="msg user">
          <div class="msg-avatar">你</div>
          <div class="msg-bubble">为什么是行乘列？不是每个位置直接乘吗？</div>
        </div>
        <div class="msg ai">
          <div class="msg-avatar">🍎</div>
          <div class="msg-bubble">等等，我看你这里卡住了。要不要换个角度？</div>
        </div>
      </div>
    </div>

    <!-- Suggestions -->
    <div class="suggestion-row">
      <button class="suggestion-pill" style="border-color:var(--color-warning);color:var(--color-warning);font-weight:600">
        🔍 用个具体例子试试
      </button>
      <button class="suggestion-pill">
        🧩 在画布上摆开看
      </button>
      <button class="suggestion-pill">
        ☕ 先休息一下
      </button>
    </div>

    <!-- Input Bar -->
    <div class="learn-input-bar">
      <input type="text" placeholder="问苹果果……">
      <button class="learn-send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

  </div>
</div>

<!-- Bottom Nav -->
<nav id="bottom-nav">
  <button class="nav-tab active" data-page="today">
    <svg viewBox="0 0 24 24" fill="none"><path d="M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Today</span>
  </button>
  <button class="nav-tab" data-page="growth">
    <svg viewBox="0 0 24 24" fill="none"><path d="M3 17l6-6 4 4 8-8M14 7h7v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Growth</span>
  </button>
  <button class="nav-tab" data-page="profile">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Profile</span>
  </button>
  <button class="nav-tab" data-page="more">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="2" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="12" r="2" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>更多</span>
  </button>
</nav>

</body>
</html>
