<!DOCTYPE html>
<html lang="zh-CN" class="theme-beige">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppleGo 3.0 → 重定向</title>
<link rel="stylesheet" href="design-system.css">
<style>
body {
  background: var(--page-bg);
  display: grid;
  place-items: center;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
}
.rd-wrap {
  text-align: center;
  max-width: 400px;
}
.rd-apple {
  font-size: 48px;
  margin-bottom: 12px;
}
.rd-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.rd-summary {
  font-size: 15px;
  color: var(--text-muted);
  margin-bottom: 24px;
}
.rd-link {
  display: inline-block;
  font-size: 14px;
  font-weight: 600;
  color: #5ac8fa;
  padding: 10px 24px;
  border-radius: 999px;
  border: 1px solid rgba(90,200,250,0.2);
  transition: all 0.2s;
  text-decoration: none;
}
.rd-link:hover {
  background: rgba(90,200,250,0.1);
  border-color: rgba(90,200,250,0.4);
}
</style>
</head>
<body>
<div class="rd-wrap">
  <div class="rd-apple">🍎</div>
  <div class="rd-title">AppleGo 3.0</div>
  <div class="rd-summary">→ 5 个核心页面 · 29+ 种状态 · 12+ 种学习模式</div>
  <a class="rd-link" href="index.html">进入 Demo 3.0 总览 →</a>
</div>
</body>
</html>
