<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>第一次查看 · 苹果果眼中的你 · AppleGo Product Vision</title>
<link rel="stylesheet" href="../design-system.css">
</head>
<body>

<div id="app" class="fade-in">

  <!-- State Meta Card -->
  <div class="state-meta">
    <div class="sm-row">
      <span class="sm-label">Emotion Goal</span>
      <span class="sm-value"><span class="sm-emotion neutral">🔵 neutral</span> 期待 + 被了解 — "苹果果刚开始认识我"</span>
    </div>
    <div class="sm-row">
      <span class="sm-label">AI Behavior</span>
      <span class="sm-value">我们刚开始。你最近在学矩阵乘法，我还在慢慢了解你的节奏。</span>
    </div>
    <div class="sm-row">
      <span class="sm-label">Time Dimension</span>
      <span class="sm-value">第一次查看 Profile</span>
    </div>
  </div>

  <!-- Page Title -->
  <h1 class="page-title">苹果果眼中的你</h1>

  <!-- Profile Mirror Narrative -->
  <div class="profile-mirror">
    我们刚开始。你最近在学<span class="highlight">矩阵乘法</span>，我还在慢慢了解你的节奏。<br><br>
    才一起走过一次学习，我还不确定你更喜欢什么方式。不过没关系——每多学一次，我就多懂你一点。
  </div>

  <!-- Profile Section: 关于你的学习 -->
  <div class="profile-section">
    <h3>关于你的学习</h3>
    <div class="pref-grid">
      <div class="pref-row">
        <span class="pref-label">学习方式</span>
        <span class="pref-value">未知</span>
      </div>
      <div class="pref-row">
        <span class="pref-label">学习节奏</span>
        <span class="pref-value">刚刚开始</span>
      </div>
      <div class="pref-row">
        <span class="pref-label">最近在学</span>
        <span class="pref-value">线性代数</span>
      </div>
      <div class="pref-row">
        <span class="pref-label">已经一起走过</span>
        <span class="pref-value">1 次学习</span>
      </div>
    </div>
  </div>

  <!-- Profile Section: 苹果果知道的 -->
  <div class="profile-section">
    <h3>苹果果知道的</h3>
    <div class="pref-grid">
      <div class="pref-row">
        <span class="pref-label">了解的深度</span>
        <span class="pref-value">刚刚开始</span>
      </div>
      <div class="pref-row">
        <span class="pref-label">数据还不够</span>
        <span class="pref-value">再学几次就有更多洞察了</span>
      </div>
    </div>
  </div>

</div>

<!-- Bottom Navigation -->
<nav id="bottom-nav">
  <button class="nav-tab" data-page="today">
    <svg viewBox="0 0 24 24" fill="none"><path d="M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Today</span>
  </button>
  <button class="nav-tab" data-page="growth">
    <svg viewBox="0 0 24 24" fill="none"><path d="M3 17l6-6 4 4 8-8M14 7h7v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Growth</span>
  </button>
  <button class="nav-tab active" data-page="profile">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span>Profile</span>
  </button>
  <button class="nav-tab" data-page="more">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="2" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="12" r="2" stroke="currentColor" stroke-width="1.8"/></svg>
    <span>更多</span>
  </button>
</nav>

</body>
</html>
