<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🍎 苹果果 · 第一次进入</title>
<link rel="stylesheet" href="../design-system.css">
<style>
  .welcome-hero .apple { animation: floatApple 3s var(--ease-spring) infinite; }
  @keyframes floatApple {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .welcome-hero .subtitle { font-size: 14px; color: var(--color-ink-muted); margin-top: -8px; margin-bottom: var(--space-5); }
  .btn-primary.btn-start {
    position: relative; overflow: hidden;
    animation: pulseGlow 2s var(--ease-out) infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 4px 14px var(--color-accent-glow); }
    50% { box-shadow: 0 4px 28px var(--color-accent-glow), 0 0 0 4px var(--color-accent-soft); }
  }
  .feature-strip {
    display: flex; flex-direction: column; gap: 12px;
    margin: var(--space-5) auto; max-width: 320px;
  }
  .feature-item {
    display: flex; align-items: center; gap: 12px;
    font-size: 14px; color: var(--color-ink-secondary);
    padding: 10px 14px; background: var(--color-surface);
    border-radius: var(--radius-md);
    box-shadow: 0 0 0 1px var(--color-divider-soft);
    animation: slideUp 0.5s var(--ease-out) both;
  }
  .feature-item:nth-child(1) { animation-delay: 0.2s; }
  .feature-item:nth-child(2) { animation-delay: 0.35s; }
  .feature-item:nth-child(3) { animation-delay: 0.5s; }
  .feature-item .fi-ic {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center; font-size: 16px; flex-shrink: 0;
  }
</style>
</head>
<body>

<main id="app">

  <!-- State Meta -->
  <div class="state-meta">
    <div class="sm-row">
      <span class="sm-label">Emotion Goal</span>
      <span class="sm-value"><span class="sm-emotion warm">🟢 warm</span> 好奇 + 期待 — "我想试试"</span>
    </div>
    <div class="sm-row">
      <span class="sm-label">AI Behavior</span>
      <span class="sm-value">Welcome hero · 无 observation · 无 last-session-card · 单 CTA</span>
    </div>
    <div class="sm-row">
      <span class="sm-label">Time Dimension</span>
      <span class="sm-value">第 0 天 · 完全新用户</span>
    </div>
  </div>

  <!-- Today Content -->
  <p class="today-quote">「理解一个概念，比记住一百个更重要。」</p>

  <div class="welcome-hero fade-in">
    <span class="apple">🍎</span>
    <h1>欢迎来到苹果果</h1>
    <p class="subtitle">我是你的 AI 学习伙伴</p>
    <p>
      每次学习，我都会更了解你一点。<br>
      从今天开始，我们一起走。
    </p>

    <div class="feature-strip">
      <div class="feature-item">
        <div class="fi-ic" style="background:var(--color-accent-soft)">🧠</div>
        <span>AI 记得你学过什么、卡在哪里</span>
      </div>
      <div class="feature-item">
        <div class="fi-ic" style="background:var(--color-purple-soft)">📈</div>
        <span>你的成长看得见——不只分数</span>
      </div>
      <div class="feature-item">
        <div class="fi-ic" style="background:var(--color-teal-soft)">🔗</div>
        <span>工具打通：闪卡、阅读、画布、口语</span>
      </div>
    </div>

    <div class="cta-block" style="margin-top: var(--space-5);">
      <button class="btn btn-primary btn-lg btn-start">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        开始第一次学习
      </button>
      <span class="cta-hint">大约 15 分钟 · 从你想学的东西开始</span>
    </div>
  </div>

</main>

<!-- Bottom Navigation -->
<nav id="bottom-nav">
  <button class="nav-tab active" data-page="today">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Today</span>
  </button>
  <button class="nav-tab" data-page="growth">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M3 17l6-6 4 4 8-8M14 7h7v7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Growth</span>
  </button>
  <button class="nav-tab" data-page="profile">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
      <path d="M4 21c0-4 4-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span>Profile</span>
  </button>
  <button class="nav-tab" data-page="more">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="6" cy="12" r="2" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="18" cy="12" r="2" stroke="currentColor" stroke-width="1.8"/>
    </svg>
    <span>更多</span>
  </button>
</nav>

</body>
</html>
