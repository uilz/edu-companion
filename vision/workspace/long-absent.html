<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AppleGo — 欢迎回来</title>
  <link rel="stylesheet" href="../design-system.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f12;
      color: #f5f5f7;
      font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(10, 132, 255, 0.25); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 3px; }

    .workspace-grid {
      display: grid;
      grid-template-columns: 180px 1fr;
      grid-template-rows: 56px 1fr auto;
      grid-template-areas:
        "topbar topbar"
        "sidebar main"
        "sidebar tools";
      min-height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 68px;
    }

    .top-bar {
      grid-area: topbar;
      display: flex; align-items: center; justify-content: center;
      padding: 0 20px; height: 56px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(15,15,18,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .top-bar-logo { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: #f5f5f7; }
    .top-bar-logo span { color: #0a84ff; }

    .obs-sidebar {
      grid-area: sidebar;
      padding: 20px 16px;
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column; gap: 16px;
    }
    .obs-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: #636366;
    }
    .obs-card {
      background: rgba(255,255,255,0.03);
      border-radius: 10px; padding: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .obs-card .obs-text { font-size: 13px; line-height: 1.5; color: #aeaeb2; }
    .obs-card .obs-sub { font-size: 11px; color: #636366; margin-top: 6px; }
    .obs-card .obs-highlight { font-size: 24px; font-weight: 700; color: #f5f5f7; line-height: 1.1; }
    .obs-card .obs-highlight-label { font-size: 11px; color: #636366; margin-top: 2px; }

    .main-content {
      grid-area: main;
      padding: 48px 28px 20px;
      overflow-y: auto;
      max-width: 520px;
    }

    .welcome-back {
      text-align: center;
      margin-bottom: 28px;
    }
    .welcome-back .wb-icon { font-size: 48px; display: block; margin-bottom: 12px; }
    .welcome-back h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: #f5f5f7; }
    .welcome-back p { font-size: 14px; color: #aeaeb2; margin-top: 8px; }

    .where-left-card {
      background: linear-gradient(145deg, rgba(10,132,255,0.06), rgba(10,132,255,0.01));
      border: 1px solid rgba(10,132,255,0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .where-left-card .wlc-label { font-size: 11px; color: #0a84ff; font-weight: 600; margin-bottom: 8px; }
    .where-left-card .wlc-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #f5f5f7; }
    .where-left-card .wlc-desc { font-size: 14px; line-height: 1.7; color: #aeaeb2; margin-bottom: 16px; }
    .where-left-card .wlc-stats { display: flex; gap: 20px; }
    .where-left-card .wlc-stat { font-size: 12px; color: #636366; }
    .where-left-card .wlc-stat strong { color: #0a84ff; }

    .ai-comfort {
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .ai-comfort .ac-label { font-size: 11px; color: #aeaeb2; font-weight: 600; margin-bottom: 8px; }
    .ai-comfort .ac-text { font-size: 14px; line-height: 1.7; color: #d1d1d6; }
    .ai-comfort .ac-text em { color: #5ac8fa; font-style: italic; }

    .resume-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .resume-actions .ra-btn {
      padding: 12px 24px; border-radius: 9999px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.15s; border: none; font-family: inherit;
    }
    .resume-actions .ra-btn.primary { background: #0a84ff; color: #fff; }
    .resume-actions .ra-btn.primary:hover { background: #0070e0; }
    .resume-actions .ra-btn.outline {
      background: transparent; color: #aeaeb2;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .resume-actions .ra-btn.outline:hover { background: rgba(255,255,255,0.04); color: #f5f5f7; }

    .tools-drawer {
      grid-area: tools;
      padding: 12px 28px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .tool-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px; color: #8e8e93;
      font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.08); color: #f5f5f7; }

    #bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 68px;
      background: rgba(15,15,18,0.92);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: center; align-items: center;
      gap: 28px; z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .nav-tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: #636366; font-size: 10.5px; font-weight: 500;
      padding: 8px 10px; border-radius: 10px;
      transition: color 0.15s; min-width: 56px;
      cursor: pointer; background: none; border: none; font-family: inherit;
    }
    .nav-tab:hover { color: #8e8e93; }
    .nav-tab.active { color: #0a84ff; }
    .nav-tab .nav-icon-tab { font-size: 20px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 640px) {
      .workspace-grid {
        grid-template-columns: 1fr;
        grid-template-areas: "topbar" "main" "tools";
      }
      .obs-sidebar { display: none; }
      .main-content { padding: 32px 16px; }
    }
  </style>
</head>
<body>

<!-- STATE-META
  Emotion Goal: Welcomed without guilt, memory is still there, no pressure
  AI Behavior: Recognize absence, reassure that memory persists, offer gentle re-entry
  Time Dimension: User returns after 7+ days away
-->

<div class="workspace-grid">

  <header class="top-bar">
    <div class="top-bar-logo">🍎 <span>AppleGo</span></div>
  </header>

  <aside class="obs-sidebar">
    <div class="obs-label">记忆</div>

    <div class="obs-card">
      <div class="obs-text">上次学习：7 天前</div>
    </div>

    <div class="obs-card">
      <div class="obs-text">上次学的内容：</div>
      <div class="obs-sub">矩阵乘法几何意义</div>
    </div>

    <div class="obs-card">
      <div class="obs-text">你对"线性变换"这个概念的理解保留了 70%</div>
      <div class="obs-sub">比预期好</div>
    </div>
  </aside>

  <main class="main-content">

    <div class="welcome-back">
      <span class="wb-icon">🌱</span>
      <h2>好久不见</h2>
      <p>你没有忘记什么。记忆还在。</p>
    </div>

    <div class="where-left-card">
      <div class="wlc-label">📋 上次做到这里</div>
      <div class="wlc-title">矩阵乘法的几何意义：线性变换的复合</div>
      <div class="wlc-desc">
        你正在理解为什么矩阵乘法本质上是线性变换的复合运算。
        你还标记了一个问题：为什么矩阵乘法不满足交换律。
      </div>
      <div class="wlc-stats">
        <span class="wlc-stat">⏱ 学习了 <strong>32 分钟</strong></span>
        <span class="wlc-stat">📌 进度 <strong>75%</strong></span>
      </div>
    </div>

    <div class="ai-comfort">
      <div class="ac-label">🍎 AppleGo 说</div>
      <div class="ac-text">
        你没有忘记什么。记忆还在。要从上次停下的地方开始吗？
        <br/><br/>
        <em>这几天你可能想了想——很多人暂停一段时间后反而理解了更多。</em>
      </div>
    </div>

    <div class="resume-actions">
      <button class="ra-btn primary">▶ 从上次停下的地方开始</button>
      <button class="ra-btn outline">🔄 快速回顾一下</button>
      <button class="ra-btn outline">✨ 学点新的</button>
    </div>

  </main>

  <div class="tools-drawer">
    <button class="tool-btn">📝 快速回顾</button>
    <button class="tool-btn">📋 上次笔记</button>
    <button class="tool-btn">🎯 设定新目标</button>
  </div>

</div>

<nav id="bottom-nav">
  <button class="nav-tab active">
    <span class="nav-icon-tab">🔲</span> Workspace
  </button>
  <button class="nav-tab">
    <span class="nav-icon-tab">🧠</span> Memory
  </button>
  <button class="nav-tab">
    <span class="nav-icon-tab">🧬</span> Brain
  </button>
  <button class="nav-tab">
    <span class="nav-icon-tab">🌌</span> Universe
  </button>
  <button class="nav-tab">
    <span class="nav-icon-tab">🤝</span> Relationship
  </button>
</nav>

</body>
</html>
