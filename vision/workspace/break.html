<!DOCTYPE html>
<html lang="zh-CN" class="theme-beige">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AppleGo — 休息一下</title>
  <link rel="stylesheet" href="../design-system.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--page-bg);
      color: var(--text-primary);
      font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(10, 132, 255, 0.25); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 3px; }

    .workspace-grid {
      display: grid;
      grid-template-columns: 180px 1fr;
      grid-template-rows: 56px 1fr auto;
      grid-template-areas:
        "topbar topbar"
        "sidebar main"
        "sidebar tools";
      min-height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 68px;
    }

    .top-bar {
      grid-area: topbar;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 56px;
      border-bottom: 1px solid var(--border-light);
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 10;
    }
    .top-bar-left { display: flex; align-items: center; gap: 12px; }
    .top-bar-logo { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); }
    .top-bar-logo span { color: #0a84ff; }
    .top-bar-title { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .top-bar-right { display: flex; align-items: center; gap: 16px; }
    .mode-badge {
      font-size: 11px; font-weight: 600; color: #5ac8fa;
      background: rgba(90,200,250,0.1);
      padding: 4px 10px; border-radius: 9999px;
      border: 1px solid rgba(90,200,250,0.2);
    }

    .obs-sidebar {
      grid-area: sidebar;
      padding: 20px 16px;
      border-right: 1px solid var(--border-light);
      display: flex; flex-direction: column; gap: 16px;
      overflow-y: auto;
    }
    .obs-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-muted);
    }
    .obs-card {
      background: var(--surface-alt);
      border-radius: 10px; padding: 12px;
      border: 1px solid var(--border-subtle);
    }
    .obs-card .obs-text { font-size: 13px; line-height: 1.5; color: var(--text-secondary); }
    .obs-card .obs-sub { font-size: 11px; color: var(--text-muted); margin-top: 6px; }
    .obs-card .obs-stat {
      display: flex; flex-direction: column; gap: 6px;
    }
    .obs-card .obs-stat-item {
      display: flex; justify-content: space-between;
      font-size: 12px; color: var(--text-secondary);
    }
    .obs-card .obs-stat-item .val { color: var(--text-primary); font-weight: 600; }

    .main-content {
      grid-area: main;
      padding: 40px 28px 20px;
      overflow-y: auto;
      max-width: 520px;
      opacity: 0.85;
      transition: opacity 0.5s;
    }

    .break-card {
      text-align: center;
      padding: 36px 28px;
      background: linear-gradient(145deg, rgba(90,200,250,0.06), rgba(90,200,250,0.01));
      border: 1px solid rgba(90,200,250,0.1);
      border-radius: 20px;
      animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-bottom: 24px;
    }
    .break-card .bc-icon { font-size: 48px; margin-bottom: 16px; display: block; }
    .break-card .bc-title {
      font-size: 22px; font-weight: 700; color: var(--text-primary);
      margin-bottom: 10px; letter-spacing: -0.02em;
    }
    .break-card .bc-desc {
      font-size: 14px; color: var(--text-secondary); line-height: 1.7;
      margin-bottom: 8px; max-width: 380px; margin-left: auto; margin-right: auto;
    }
    .break-card .bc-science {
      font-size: 12px; color: #5ac8fa; font-style: italic;
      padding: 8px 16px; background: rgba(90,200,250,0.06);
      border-radius: 8px; display: inline-block; margin-bottom: 20px;
    }
    .break-card .bc-actions {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    }
    .break-card .bc-btn {
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      border: none; font-family: inherit;
    }
    .break-card .bc-btn.primary {
      background: #0a84ff; color: #fff;
      box-shadow: 0 4px 14px rgba(10,132,255,0.15);
    }
    .break-card .bc-btn.primary:hover { background: #0070e0; }
    .break-card .bc-btn.outline {
      background: transparent; color: var(--text-secondary);
      border: 1px solid var(--border-light);
    }
    .break-card .bc-btn.outline:hover { background: var(--surface-alt); color: var(--text-primary); }

    .tools-drawer {
      grid-area: tools;
      padding: 12px 28px 16px;
      border-top: 1px solid var(--border-light);
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .tool-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      background: var(--surface-alt);
      border: 1px solid var(--border-light);
      border-radius: 8px; color: var(--text-secondary);
      font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    .tool-btn:hover { background: var(--surface-bg); color: var(--text-primary); }

    #bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 68px;
      background: var(--nav-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-light);
      display: flex; justify-content: center; align-items: center;
      gap: 28px; z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .nav-tab {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: var(--text-muted); font-size: 10.5px; font-weight: 500;
      padding: 8px 10px; border-radius: 10px;
      transition: color 0.15s; min-width: 56px;
      cursor: pointer; background: none; border: none; font-family: inherit;
    }
    .nav-tab:hover { color: var(--text-secondary); }
    .nav-tab.active { color: #0a84ff; }
    .nav-tab .nav-icon-tab { font-size: 20px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 640px) {
      .workspace-grid {
        grid-template-columns: 1fr;
        grid-template-areas: "topbar" "main" "tools";
      }
      .obs-sidebar { display: none; }
      .main-content { padding: 32px 16px; }
    }
  </style>
</head>
<body>

<!-- STATE-META
  Emotion Goal: Calm, cared for, trusted to make the right choice about rest
  AI Behavior: Suggest break based on session duration, explain benefits, respect user's choice
  Time Dimension: After 45 minutes of continuous study
-->

<div class="workspace-grid">

  <header class="top-bar">
    <div class="top-bar-left">
      <div class="top-bar-logo">🍎 <span>AppleGo</span></div>
      <div class="top-bar-title">📖 阅读模式</div>
    </div>
    <div class="top-bar-right">
      <span class="mode-badge">☕ 休息建议</span>
    </div>
  </header>

  <aside class="obs-sidebar">
    <div class="obs-label">今日概览</div>

    <div class="obs-card">
      <div class="obs-stat">
        <div class="obs-stat-item">
          <span>⏱ 学习时长</span>
          <span class="val">45 分钟</span>
        </div>
        <div class="obs-stat-item">
          <span>📌 新概念</span>
          <span class="val">6 个</span>
        </div>
        <div class="obs-stat-item">
          <span>💬 交互次数</span>
          <span class="val">23 次</span>
        </div>
        <div class="obs-stat-item">
          <span>✏️ 笔记</span>
          <span class="val">5 条</span>
        </div>
      </div>
    </div>

    <div class="obs-card">
      <div class="obs-text">你的专注时长已经超过了最佳学习窗口</div>
      <div class="obs-sub">休息后记忆巩固效果提升 40%</div>
    </div>
  </aside>

  <main class="main-content">

    <div class="break-card">
      <span class="bc-icon">🧘</span>
      <div class="bc-title">你已经持续学习了 45 分钟</div>
      <div class="bc-desc">休息一下效果更好。大脑在休息时会巩固记忆，把短期知识转化为长期理解。</div>
      <div class="bc-science">🧠 神经科学研究：间隔学习比连续学习效率高 30%</div>
      <div class="bc-actions">
        <button class="bc-btn primary">休息 5 分钟</button>
        <button class="bc-btn outline">再学一会儿</button>
        <button class="bc-btn outline">结束今天的学习</button>
      </div>
    </div>

    <div style="border-left: 2px solid rgba(90,200,250,0.2); padding-left: 16px;">
      <div style="font-size: 12px; color: #5ac8fa; font-weight: 600; margin-bottom: 8px;">💡 你可能不知道</div>
      <div style="font-size: 13px; color: var(--text-muted); line-height: 1.6;">
        你在休息时，大脑的海马体会回放刚才学习的内容——就像在梦里重新播放今天的经历。
        这就是为什么有时候"睡一觉就懂了"。
      </div>
    </div>

  </main>

  <div class="tools-drawer">
    <button class="tool-btn">📝 快速笔记</button>
    <button class="tool-btn">🎵 背景音乐</button>
    <button class="tool-btn">⏰ 设置番茄钟</button>
  </div>

</div>

<nav id="bottom-nav">
  <button class="nav-tab active">
    <span class="nav-icon-tab">🔲</span> Workspace
  </button>
  <button class="nav-tab">
    <span class="nav-icon-tab">🧠</span> Memory
  </button>
  <button class="nav-tab">
    <span class="nav-icon-tab">🧬</span> Brain
  </button>
  <button class="nav-tab">
    <span class="nav-icon-tab">🌌</span> Universe
  </button>
  <button class="nav-tab">
    <span class="nav-icon-tab">🤝</span> Relationship
  </button>
</nav>

</body>
</html>
