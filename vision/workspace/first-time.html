<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AppleGo — 欢迎</title>
  <link rel="stylesheet" href="../design-system.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f12;
      color: #f5f5f7;
      font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(10, 132, 255, 0.25); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a3c; border-radius: 3px; }

    .first-time-container {
      max-width: 520px;
      width: 100%;
      padding: 40px 24px 100px;
      text-align: center;
    }

    .hero {
      margin-bottom: 40px;
    }
    .hero .apple-icon {
      font-size: 72px;
      display: block;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }
    .hero h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f5f5f7;
      margin-bottom: 8px;
    }
    .hero p {
      font-size: 15px;
      color: #8e8e93;
      line-height: 1.7;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 36px;
    }
    .mode-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 20px 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .mode-card:nth-child(2) { animation-delay: 0.05s; }
    .mode-card:nth-child(3) { animation-delay: 0.1s; }
    .mode-card:nth-child(4) { animation-delay: 0.15s; }
    .mode-card:nth-child(5) { animation-delay: 0.2s; }
    .mode-card:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(10,132,255,0.2);
      transform: translateY(-2px);
    }
    .mode-card .mc-icon {
      font-size: 32px;
      display: block;
      margin-bottom: 10px;
    }
    .mode-card .mc-name {
      font-size: 15px;
      font-weight: 600;
      color: #f5f5f7;
      margin-bottom: 4px;
    }
    .mode-card .mc-desc {
      font-size: 12px;
      color: #636366;
      line-height: 1.5;
    }
    .mode-card.wide {
      grid-column: span 2;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      padding: 16px 20px;
    }
    .mode-card.wide .mc-icon { margin-bottom: 0; font-size: 28px; }
    .mode-card.wide .mc-body { flex: 1; }

    .bottom-hint {
      font-size: 12px;
      color: #48484a;
    }

    #bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: rgba(15,15,18,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #636366;
      font-size: 10.5px;
      font-weight: 500;
      padding: 8px 10px;
      border-radius: 10px;
      transition: color 0.15s;
      min-width: 56px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }
    .nav-tab.active { color: #0a84ff; }
    .nav-tab.disabled { opacity: 0.3; cursor: default; }
    .nav-tab .nav-icon-tab { font-size: 20px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .fade-in { animation: fadeIn 0.4s ease-out; }

    @media (max-width: 480px) {
      .mode-grid { grid-template-columns: 1fr; }
      .mode-card.wide { grid-column: span 1; }
    }
  </style>
</head>
<body>

<!-- STATE-META
  Emotion Goal: Curious, welcomed, intrigued by possibilities
  AI Behavior: Present itself warmly, offer mode choices, no data collection yet
  Time Dimension: First ever visit — brand new user onboarding
-->

<div class="first-time-container">

  <div class="hero fade-in">
    <span class="apple-icon">🍎</span>
    <h1>欢迎来到 AppleGo</h1>
    <p>一个理解你学习过程的 AI 学习伴侣</p>
  </div>

  <div class="mode-grid">
    <div class="mode-card">
      <span class="mc-icon">📖</span>
      <div class="mc-name">读点什么</div>
      <div class="mc-desc">从精选内容开始探索</div>
    </div>
    <div class="mode-card">
      <span class="mc-icon">💬</span>
      <div class="mc-name">聊个话题</div>
      <div class="mc-desc">和 AI 深入对话</div>
    </div>
    <div class="mode-card">
      <span class="mc-icon">🤔</span>
      <div class="mc-name">自己想想</div>
      <div class="mc-desc">自由思考，记录想法</div>
    </div>
    <div class="mode-card">
      <span class="mc-icon">🎨</span>
      <div class="mc-name">画点什么</div>
      <div class="mc-desc">用视觉表达理解</div>
    </div>
    <div class="mode-card wide">
      <span class="mc-icon">📐</span>
      <div class="mc-body">
        <div class="mc-name">开始做项目</div>
        <div class="mc-desc">用实践驱动学习，从一个小目标开始</div>
      </div>
    </div>
  </div>

  <div class="bottom-hint">
    我们可以从任何你喜欢的方式开始
  </div>

</div>

<nav id="bottom-nav">
  <button class="nav-tab active">
    <span class="nav-icon-tab">🔲</span> Workspace
  </button>
  <button class="nav-tab disabled">
    <span class="nav-icon-tab">🧠</span> Memory
  </button>
  <button class="nav-tab disabled">
    <span class="nav-icon-tab">🧬</span> Brain
  </button>
  <button class="nav-tab disabled">
    <span class="nav-icon-tab">🌌</span> Universe
  </button>
  <button class="nav-tab disabled">
    <span class="nav-icon-tab">🤝</span> Relationship
  </button>
</nav>

</body>
</html>
